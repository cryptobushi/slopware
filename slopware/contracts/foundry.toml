[profile.default]
src = "src"
out = "out"
libs = ["lib"]
solc = "0.8.26"
evm_version = "cancun"
optimizer = true
optimizer_runs = 5000
via_ir = false
fs_permissions = [{ access = "read", path = "./test/corpus" }]
gas_reports = ["Slopware"]
# the corpus test places thousands of programs in one run
gas_limit = 30000000000

[fuzz]
runs = 512
